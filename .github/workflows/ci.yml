name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax and shellcheck
        run: |
          bash -n scripts/doctor.sh
          shellcheck scripts/*.sh

      - name: Helper script tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Docker isolation check (renders compose.yaml, starts nothing)
        run: docker compose --env-file .env.example config --format json | python3 scripts/check_docker_scope.py

      - name: Doctor (CI mode, read-only)
        run: bash scripts/doctor.sh --ci

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Lint (ruff)
        run: make backend-lint

      - name: Type check (mypy --strict)
        run: make backend-typecheck

      - name: Tests with branch coverage (at least 95%)
        run: make backend-test

      # Fails on purpose until the three golden bills are hand-checked and
      # signed off (decision 0004, D8). Do not skip or disable it.
      - name: Golden-bill merge gate (hand-checked bills)
        run: make backend-golden

  # Step 4: SAMAY's database code against a real PostgreSQL 16. The service
  # container runs on GitHub's runner only; nothing here touches a developer Mac.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HYPOTHESIS_PROFILE: ci
      SAMAY_DATABASE_URL: postgresql+psycopg://samay:ci-only-password@127.0.0.1:55432/samay
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: samay
          POSTGRES_USER: samay
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U samay -d samay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Apply migrations (make db-migrate)
        run: make db-migrate

      - name: Database tests with coverage of samay/db (at least 95%)
        run: make backend-db-test
