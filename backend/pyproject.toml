[project]
name = "samay-backend"
version = "0.1.0"
description = "SAMAY backend: deterministic electricity cost calculations"
readme = "README.md"
requires-python = ">=3.13"
# The calculation core uses only the Python standard library.
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
# Development tools only. They live in backend/.venv, never globally.
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "coverage>=7.6",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx2>=2.16.0",
]

[tool.uv]
# Not built or published as a package; tests import from src/ directly.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/samay"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError", "@overload", "if __name__ == .__main__.:"]

[tool.mypy]
strict = true
python_version = "3.13"
# tests/billing/bills.py and tests/dbhelpers.py are shared helper modules.
mypy_path = "src:tests:tests/billing"
explicit_package_bases = true
files = ["src", "tests", "migrations"]
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "C4", "PIE", "RET"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]
